# NovaLab common tmux configuration

# Terminal and color handling
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g set-clipboard external

# Keep the native tmux prefix
set -g prefix C-b
bind C-b send-prefix

# General behavior
set -g mouse on
set -g history-limit 100000
set -s escape-time 10
set -g repeat-time 500
set -g display-time 2000
set -g display-panes-time 1500
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Vim-style command and copy modes
set -g status-keys vi
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Open panes and windows in the current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation after pressing Ctrl+B
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resizing after pressing Ctrl+B
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# Reload the active configuration
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# Window and terminal titles
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S:#I:#W"

# Status bar geometry
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100

# Shared neutral pastel theme
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"

set -g status-right "#[fg=#45475a,bg=#1e1e2e]#[fg=#cdd6f4,bg=#45475a] #H #[fg=#89b4fa,bg=#45475a]#[fg=#1e1e2e,bg=#89b4fa,bold] %Y-%m-%d %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e] #I:#W#F "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#b4befe,bold] #I:#W#F "

# Pane and message styling
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g display-panes-colour "#f9e2af"
set -g display-panes-active-colour "#a6e3a1"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#89b4fa"

# Window activity
setw -g monitor-activity on
set -g visual-activity off
# tmux 3.5 reduced this timeout to 10 ms. Restore the previous default so
# terminal-query responses arriving over SSH do not leak into shell input.
set-option -sg escape-time 500
