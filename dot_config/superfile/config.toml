# NovaLab common Superfile configuration

# File and directory editors inherit EDITOR and VISUAL from the common shell.
editor = ""
dir_editor = ""

# Software versions are managed centrally by the bootstrap layer.
auto_check_update = false

# Shell directory integration will be considered with the common aliases later.
cd_on_quit = false

# Preview behavior.
default_open_file_preview = true
show_image_preview = false
show_panel_footer_info = true

# Begin in the directory from which Superfile was launched.
default_directory = "."

# Use binary file-size units: KiB, MiB, and GiB.
file_size_use_si = false

# Sort by name in ascending, case-insensitive order.
default_sort_type = 0
sort_order_reversed = false
case_sensitive_sort = false

shell_close_on_success = false
page_scroll_size = 0
debug = false

# Allow the same intentionally minimal file to survive additions in newer
# Superfile versions without producing a warning for every new upstream field.
ignore_missing_fields = true

file_panel_extra_columns = 0
file_panel_name_percent = 60

# Shared NovaLab visual theme.
theme = "novalab"

# Use Superfile's built-in Chroma renderer for predictable SSH previews.
code_previewer = ""

nerdfont = true
show_select_icons = true
transparent_background = true

file_preview_width = 2
enable_file_preview_border = true

sidebar_width = 18
sidebar_sections = ["home", "pinned", "disks"]

# Rounded box-drawing borders.
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'

# Optional plugins remain disabled until deliberately added to the baseline.
metadata = false
enable_md5_checksum = false
zoxide_support = false

# This table must remain at the end of the file.
[open_with]
