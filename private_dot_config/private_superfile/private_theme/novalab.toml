# NovaLab common Superfile theme
#
# A neutral blue-lavender pastel theme shared across every host. Unlike
# Starship and btop, Superfile does not communicate host identity.

###############################################################################
# Code syntax highlighting
###############################################################################

code_syntax_highlight = "nord"

###############################################################################
# Base colors
###############################################################################

# Full screen.
full_screen_fg = "#D9E2F2"
full_screen_bg = "#1B2130"

# Two-color interface gradient.
gradient_color = ["#7895BD", "#B4A9E8"]
directory_icon_color = "#91AED8"

# File panel.
file_panel_fg = "#D9E2F2"
file_panel_bg = "#1B2130"
file_panel_border = "#465875"
file_panel_border_active = "#A9C4E8"
file_panel_top_directory_icon = "#9AD5CA"
file_panel_top_path = "#91AED8"
file_panel_item_selected_fg = "#EDF4FF"
file_panel_item_selected_bg = "#3E4C66"

# Footer.
footer_fg = "#C9D4E8"
footer_bg = "#1B2130"
footer_border = "#465875"
footer_border_active = "#91AED8"

# Sidebar.
sidebar_fg = "#C9D4E8"
sidebar_bg = "#1B2130"
sidebar_title = "#A9C4E8"
sidebar_border = "#39475F"
sidebar_border_active = "#B4A9E8"
sidebar_item_selected_fg = "#EDF4FF"
sidebar_item_selected_bg = "#3E4C66"
sidebar_divider = "#596B87"

# Modals.
modal_fg = "#D9E2F2"
modal_bg = "#252D40"
modal_border_active = "#A9C4E8"
modal_cancel_fg = "#252D40"
modal_cancel_bg = "#E8A2AF"
modal_confirm_fg = "#252D40"
modal_confirm_bg = "#9AD5CA"

# Help menu.
help_menu_hotkey = "#91AED8"
help_menu_title = "#B4A9E8"

# Status and interaction colors.
cursor = "#EDF4FF"
correct = "#9AD5CA"
error = "#E8A2AF"
hint = "#91AED8"
cancel = "#E8B58C"
