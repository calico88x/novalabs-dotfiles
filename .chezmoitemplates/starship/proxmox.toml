# Generated by scripts/generate-host-themes.py. Do not edit directly.
"$schema" = "https://starship.rs/config-schema.json"

format = """
[](fg:shade_1)$os$hostname[](fg:shade_1 bg:shade_2)$directory[](fg:shade_2 bg:shade_3)$git_branch$git_status$localip[](fg:shade_3 bg:shade_4)$docker_context$kubernetes$cmd_duration$time[](fg:shade_4)$line_break${custom.user_marker}${custom.root_marker}$character
"""

palette = "proxmox"
add_newline = false
command_timeout = 700

[palettes.proxmox]
shade_1 = "#65311B"
shade_2 = "#994A29"
shade_3 = "#D17147"
shade_4 = "#E1A78E"
text_light = "#F7F7FB"
text_dark = "#161923"
success = "#A6E3A1"
error = "#F38BA8"
root = "#FF6B6B"

[os]
disabled = false
style = "fg:text_light bg:shade_1"
format = "[ $symbol ]($style)"

[os.symbols]
Alpine = ""
Debian = ""
FreeBSD = ""
Linux = ""
Raspbian = ""
Ubuntu = ""
Unknown = ""

[hostname]
ssh_only = false
trim_at = ""
style = "fg:text_light bg:shade_1"
format = "[$hostname ]($style)"

[directory]
style = "fg:text_light bg:shade_2"
format = "[  $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "fg:text_dark bg:shade_3"
format = "[ $symbol$branch ]($style)"
truncation_length = 28
truncation_symbol = "…"

[git_status]
style = "fg:text_dark bg:shade_3"
format = "[$all_status$ahead_behind ]($style)"

[localip]
ssh_only = false
disabled = false
style = "fg:text_dark bg:shade_3"
format = "[ 󰩟 $localipv4 ]($style)"

[docker_context]
symbol = " "
style = "fg:text_dark bg:shade_4"
format = "[ $symbol$context ]($style)"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "fg:text_dark bg:shade_4"
format = '[ $symbol$context( \($namespace\)) ]($style)'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:text_dark bg:shade_4"
format = "[ 󰔟 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:text_dark bg:shade_4"
format = "[  $time ]($style)"

[custom.user_marker]
command = "printf '$'"
when = 'test "$(id -u)" -ne 0'
shell = ["sh"]
style = "bold shade_4"
format = "[$output]($style) "
description = "Normal-user shell marker"

[custom.root_marker]
command = "printf '#'"
when = 'test "$(id -u)" -eq 0'
shell = ["sh"]
style = "bold root"
format = "[$output]($style) "
description = "Root shell marker"

[character]
success_symbol = "[❯](bold success) "
error_symbol = "[❯](bold error) "
vimcmd_symbol = "[❮](bold success) "
vimcmd_replace_one_symbol = "[❮](bold error) "
vimcmd_replace_symbol = "[❮](bold error) "
vimcmd_visual_symbol = "[❮](bold shade_4) "
