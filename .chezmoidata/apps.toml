#
# NovaLabs declarative application catalog.
#
# Application installation and version ownership: Mise
# Configuration and profile selection: ChezMoi
#
# Profile selectors:
#   all-linux  - All managed Linux profiles
#   profiles   - Explicit profile inclusion
#
# All application versions must be exact pins.
#

[app_catalog]
schema_version = 1


# ============================================================
# Core userland applications
# ============================================================

[apps.bat]
backend = "aqua:sharkdp/bat"
version = "0.26.1"
profiles = ["all-linux"]

[apps.chezmoi]
backend = "aqua:twpayne/chezmoi"
version = "2.72.1"
profiles = ["all-linux"]

[apps.fastfetch]
backend = "aqua:fastfetch-cli/fastfetch"
version = "2.68.1"
profiles = ["all-linux"]

[apps.fd]
backend = "aqua:sharkdp/fd"
version = "10.5.0"
profiles = ["all-linux"]

[apps.fzf]
backend = "aqua:junegunn/fzf"
version = "0.74.3"
profiles = ["all-linux"]

[apps.lazygit]
backend = "aqua:jesseduffield/lazygit"
version = "0.64.1"
profiles = ["all-linux"]

[apps.lsd]
backend = "aqua:lsd-rs/lsd"
version = "1.2.0"
profiles = ["all-linux"]

[apps.neovim]
backend = "aqua:neovim/neovim"
version = "0.12.5"
profiles = ["all-linux"]

[apps.ripgrep]
backend = "aqua:BurntSushi/ripgrep"
version = "15.2.0"
profiles = ["all-linux"]

[apps.starship]
backend = "aqua:starship/starship"
version = "1.26.0"
profiles = ["all-linux"]

[apps.superfile]
backend = "aqua:yorukot/superfile"
version = "1.6.0"
profiles = ["all-linux"]

[apps.usage]
backend = "aqua:jdx/usage"
version = "6.8.0"
profiles = ["all-linux"]


# ============================================================
# Development runtimes and build tools
# ============================================================

[apps.rust]
backend = "rust"
version = "1.99.1"
profiles = ["all-linux"]

[apps.node]
backend = "core:node"
version = "26.12.1"
profiles = ["all-linux"]

[apps.tree-sitter-cli]
backend = "cargo:tree-sitter-cli"
version = "0.26.9"
profiles = ["all-linux"]

[apps.tree-sitter-cli.options]
default-features = false
locked = true
depends = ["rust"]

[apps.tree-sitter-cli.options.install_env]
RUSTUP_TOOLCHAIN = "1.99.1"


# ============================================================
# System monitoring
# ============================================================

[apps.btop]
backend = "aqua:aristocratos/btop"
version = "1.4.7"
profiles = ["all-linux"]

# ZGX retains its externally managed GPU-enabled btop build.
exclude_profiles = ["zgx"]


# ============================================================
# Container management
# ============================================================

[apps.lazydocker]
backend = "aqua:jesseduffield/lazydocker"
version = "0.25.2"
profiles = ["any", "docker", "zgx"]

# UbuntuLab requires Docker support to be selected at enrollment.
[apps.lazydocker.optional_profiles]
ubuntulab = "withDocker"

# Kubernetes administration

[apps.k9s]
backend = "aqua:derailed/k9s"
version = "0.51.0"
profiles = ["any", "lovelace", "worker1"]

# Container image inspection

[apps.dive]
backend = "aqua:wagoodman/dive"
version = "0.13.1"
profiles = ["any", "docker", "zgx"]

# Logging and network diagnostics

[apps.lazyjournal]
backend = "aqua:Lifailon/lazyjournal"
version = "0.8.7"
profiles = ["all-linux"]

[apps.network-doctor]
backend = "github:heymaikol/network-doctor"
version = "2.2.2"
profiles = ["all-linux"]

# Infrastructure terminal interfaces

[apps.tui-cert]
backend = "github:tui-tools/tui-cert"
version = "1.1.1"
profiles = ["all-linux"]

[apps.tui-disk]
backend = "github:tui-tools/tui-disk"
version = "1.0.3"
profiles = ["all-linux"]

[apps.tui-systemd]
backend = "github:tui-tools/tui-systemd"
version = "1.0.3"
profiles = ["all-linux"]

[apps.tui-traffic]
backend = "github:tui-tools/tui-traffic"
version = "0.1.5"
profiles = ["all-linux"]

[apps.tui-cron]
backend = "github:tui-tools/tui-cron"
version = "1.0.0"
profiles = ["all-linux"]

[apps.tui-ssh]
backend = "github:tui-tools/tui-ssh"
version = "1.0.0"
profiles = ["all-linux"]
