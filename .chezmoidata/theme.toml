schema_version = 2

[theme.shared]
text_light = "#F7F7FB"
text_dark = "#161923"
success = "#50FA7B"
error = "#FF5555"
root = "#FF6B6B"
warning = "#ff7f3f"

# Shared terminal application surfaces and supplementary colors.
# Host-specific accents are resolved from theme.hosts.
[theme.tui]
surface = "#242838"
surface_dark = "#10121A"
selection = "#34394A"
muted = "#A0A4B8"
cyan = "#8BE9FD"
orange = "#FF9B3E"

# Native application-wide theme preferences.
[theme.preferences]
network_doctor = "contrast"

[theme.btop_graph]
lime = "#b8f500"
yellow = "#ffe600"
amber = "#ff9100"
pink = "#ff5ac8"
magenta = "#ff2bd6"
rose = "#ff477e"

[theme.os_symbols]
Alpine = ""
Debian = ""
FreeBSD = ""
Linux = ""
Raspbian = ""
Ubuntu = ""
Unknown = ""

